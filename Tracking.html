<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Puzzle Completions</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #10101a;
      --border: #1e1e32;
      --accent: #00ffcc;
      --accent2: #ff4ef0;
      --gold: #ffd700;
      --silver: #c0c0c0;
      --bronze: #cd7f32;
      --text: #c8d0e0;
      --dim: #4a5068;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Share Tech Mono', monospace;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.08) 2px,
        rgba(0,0,0,0.08) 4px
      );
      pointer-events: none;
      z-index: 999;
    }

    header {
      padding: 40px 24px 0;
      text-align: center;
    }

    header h1 {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(12px, 3vw, 22px);
      color: var(--accent);
      text-shadow: 0 0 20px var(--accent), 0 0 40px rgba(0,255,204,0.3);
      letter-spacing: 2px;
      line-height: 1.6;
    }

    header p {
      margin-top: 12px;
      font-size: 12px;
      color: var(--dim);
      letter-spacing: 2px;
    }

    #refresh-bar {
      margin: 16px auto 0;
      width: 200px;
      height: 3px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
    }

    #refresh-progress {
      height: 100%;
      background: var(--accent);
      width: 100%;
      transform-origin: left;
      animation: drain 60s linear infinite;
      box-shadow: 0 0 8px var(--accent);
    }

    @keyframes drain {
      from { transform: scaleX(1); }
      to   { transform: scaleX(0); }
    }

    #refresh-label {
      text-align: center;
      font-size: 10px;
      color: var(--dim);
      margin-top: 6px;
      letter-spacing: 1px;
    }

    #tab-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 32px 24px 0;
      max-width: 1100px;
      margin: 0 auto;
    }

    .tab-btn {
      font-family: 'Press Start 2P', monospace;
      font-size: 9px;
      padding: 10px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--dim);
      cursor: pointer;
      letter-spacing: 1px;
      transition: all 0.15s;
      position: relative;
      text-transform: uppercase;
    }

    .tab-btn:hover {
      color: var(--accent);
      border-color: var(--accent);
    }

    .tab-btn.active {
      color: var(--accent);
      border-color: var(--accent);
      background: rgba(0,255,204,0.05);
      box-shadow: 0 0 12px rgba(0,255,204,0.15), inset 0 0 12px rgba(0,255,204,0.05);
    }

    .tab-btn .count-badge {
      position: absolute;
      top: -8px;
      right: -8px;
      background: var(--accent2);
      color: #fff;
      font-size: 7px;
      padding: 2px 5px;
      font-family: 'Share Tech Mono', monospace;
      min-width: 18px;
      text-align: center;
    }

    #panels {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px;
    }

    .panel { display: none; }
    .panel.active { display: block; }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .panel-title {
      font-family: 'Press Start 2P', monospace;
      font-size: 11px;
      color: var(--accent2);
      text-shadow: 0 0 12px rgba(255,78,240,0.4);
    }

    .panel-count {
      font-size: 11px;
      color: var(--dim);
    }

    .leaderboard { width: 100%; }

    .lb-row {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 16px;
      border: 1px solid transparent;
      margin-bottom: 6px;
      background: var(--surface);
      transition: border-color 0.15s, background 0.15s;
      animation: fadeIn 0.3s ease both;
    }

    .lb-row:hover {
      border-color: var(--border);
      background: #14141f;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .lb-row:nth-child(1) { border-left: 3px solid var(--gold); }
    .lb-row:nth-child(2) { border-left: 3px solid var(--silver); }
    .lb-row:nth-child(3) { border-left: 3px solid var(--bronze); }

    .lb-rank {
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      width: 32px;
      text-align: center;
      flex-shrink: 0;
    }

    .lb-row:nth-child(1) .lb-rank { color: var(--gold); }
    .lb-row:nth-child(2) .lb-rank { color: var(--silver); }
    .lb-row:nth-child(3) .lb-rank { color: var(--bronze); }
    .lb-row:nth-child(n+4) .lb-rank { color: var(--dim); }

    .lb-name {
      flex: 1;
      font-size: 14px;
      color: var(--text);
      letter-spacing: 1px;
    }

    .lb-date {
      font-size: 10px;
      color: var(--dim);
      flex-shrink: 0;
    }

    .empty-state {
      text-align: center;
      padding: 60px 0;
      color: var(--dim);
      font-size: 11px;
      letter-spacing: 2px;
    }

    .empty-state::before {
      content: '?';
      display: block;
      font-family: 'Press Start 2P', monospace;
      font-size: 40px;
      margin-bottom: 20px;
      color: var(--border);
    }

    .loading-state {
      text-align: center;
      padding: 60px 0;
      color: var(--dim);
      font-size: 11px;
      letter-spacing: 3px;
    }

    .loading-state::after {
      content: '';
      display: inline-block;
      width: 6px;
      height: 6px;
      background: var(--accent);
      margin-left: 8px;
      animation: blink 0.8s steps(1) infinite;
      vertical-align: middle;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    .error-state {
      text-align: center;
      padding: 40px 0;
      color: #ff4444;
      font-size: 11px;
      letter-spacing: 1px;
    }

    footer {
      text-align: center;
      padding: 40px 24px;
      color: var(--dim);
      font-size: 10px;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>

<header>
  <h1>PUZZLE COMPLETIONS</h1>
  <p>UNTITLED PUZZLE GAME &mdash; LIVE LEADERBOARD</p>
  <div id="refresh-bar"><div id="refresh-progress"></div></div>
  <div id="refresh-label">REFRESHES EVERY 60s</div>
</header>

<div id="tab-bar"></div>
<div id="panels"></div>

<footer>DATA FROM SUPABASE &bull; UPDATES EVERY 60 SECONDS</footer>

<script>
  const SUPABASE_URL = "https://nofeplwbnhtqejtwgzcn.supabase.co"
  const SUPABASE_KEY = "sb_publishable_Nm1-vzbW8rzYrYJkFXmRgQ_QSbsH4WQ"

  // ─── PUZZLES ───────────────────────────────────────────────────────────────
  // label     = what shows on the tab
  // puzzleName = exact value Roblox sends as "name" — must match PuzzleName in Supabase
  const PUZZLES = [
    { label: "Burger",         puzzleName: "Play the best game ever"  },
    { label: "Wall",           puzzleName: "WALL"                     },
    { label: "Text",           puzzleName: "is it an l or an i"       },
    { label: "Test",           puzzleName: "Test Ending"              },
    { label: "Food",           puzzleName: "Food"                     },
    { label: "Corner",         puzzleName: "Corner"                   },
    { label: "Ball",           puzzleName: "Ball"                     },
    { label: "Cipher",         puzzleName: "Cipher"                   },
    { label: "Food v2",        puzzleName: "Foodv2"                   },
    { label: "Cannon",         puzzleName: "Cannon"                   },
    { label: "Rabbit Hole",    puzzleName: "RabbitHole"               },
    { label: "RNG",            puzzleName: "Rng"                      },
    { label: "Acebeef",        puzzleName: "Acebeef"                  },
    { label: "Long Hole",      puzzleName: "LongRabbitHole"           },
    { label: "The Finale",     puzzleName: "TheFinale"                },
    { label: "Death",          puzzleName: "Death"                    },
    { label: "Fell OOB",       puzzleName: "FellOutOfMap"             },
    { label: "Drown",          puzzleName: "Drown"                    },
    { label: "Everything",     puzzleName: "Everything"               },
  ]
  // ───────────────────────────────────────────────────────────────────────────

  const tabBar = document.getElementById("tab-bar")
  const panels = document.getElementById("panels")

  PUZZLES.forEach((puzzle, i) => {
    const btn = document.createElement("button")
    btn.className = "tab-btn" + (i === 0 ? " active" : "")
    btn.innerHTML = `${puzzle.label}<span class="count-badge" id="badge-${i}">...</span>`
    btn.onclick = () => switchTab(i)
    tabBar.appendChild(btn)

    const panel = document.createElement("div")
    panel.className = "panel" + (i === 0 ? " active" : "")
    panel.id = `panel-${i}`
    panel.innerHTML = `
      <div class="panel-header">
        <span class="panel-title">${puzzle.label.toUpperCase()}</span>
        <span class="panel-count" id="count-${i}"></span>
      </div>
      <div class="leaderboard" id="lb-${i}">
        <div class="loading-state">LOADING</div>
      </div>
    `
    panels.appendChild(panel)
  })

  function switchTab(i) {
    document.querySelectorAll(".tab-btn").forEach((b, j) => b.classList.toggle("active", j === i))
    document.querySelectorAll(".panel").forEach((p, j) => p.classList.toggle("active", j === i))
  }

  function formatDate(iso) {
    const d = new Date(iso)
    return d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" })
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
  }

  async function loadPuzzle(index) {
    const puzzle = PUZZLES[index]
    const lb     = document.getElementById(`lb-${index}`)
    const badge  = document.getElementById(`badge-${index}`)
    const count  = document.getElementById(`count-${index}`)

    try {
      const url = `${SUPABASE_URL}/rest/v1/Burger?PuzzleName=eq.${encodeURIComponent(puzzle.puzzleName)}&order=CompletedAt.asc`

      const res = await fetch(url, {
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + SUPABASE_KEY
        }
      })

      if (!res.ok) {
        const err = await res.json()
        throw new Error(err.message || res.statusText)
      }

      const data = await res.json()

      badge.textContent = data.length
      count.textContent = `${data.length} completion${data.length !== 1 ? "s" : ""}`

      if (data.length === 0) {
        lb.innerHTML = `<div class="empty-state">NO COMPLETIONS YET</div>`
        return
      }

      lb.innerHTML = data.map((row, i) => `
        <div class="lb-row" style="animation-delay:${i * 30}ms">
          <span class="lb-rank">${i + 1}</span>
          <span class="lb-name">${escapeHtml(row.PlayerName)}</span>
          <span class="lb-date">${formatDate(row.CompletedAt)}</span>
        </div>
      `).join("")

    } catch (e) {
      lb.innerHTML = `<div class="error-state">ERROR: ${escapeHtml(e.message)}</div>`
      badge.textContent = "!"
    }
  }

  function loadAll() {
    PUZZLES.forEach((_, i) => loadPuzzle(i))
  }

  loadAll()

  setInterval(() => {
    loadAll()
    const bar = document.getElementById("refresh-progress")
    bar.style.animation = "none"
    bar.offsetHeight
    bar.style.animation = "drain 60s linear infinite"
  }, 60000)
</script>
</body>
</html>
